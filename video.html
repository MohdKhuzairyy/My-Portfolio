<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video | Khuzairy</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f0e7;
            color: #40372e;
            line-height: 1.6;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            height: 100vh;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: #f0f0f5;
            padding: 2rem 1.2rem;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
            z-index: 10;
            overflow-y: auto;
            transition: all 0.2s;
        }

        .sidebar h2 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
            background: linear-gradient(to right, #e0e7ff, #b1c9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar .title-tag {
            color: #aab8e0;
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1rem;
            width: 100%;
        }

        .sidebar-nav {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ccd6f0;
            text-decoration: none;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            font-weight: 450;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid transparent;
        }

        .sidebar-nav a i {
            width: 22px;
            font-size: 1.1rem;
            color: #7d93c7;
            transition: 0.2s;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.07);
            color: white;
            border-color: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        .sidebar-nav a:hover i {
            color: #b7cdff;
        }

        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-left: 3px solid #6d8cff;
        }

        .sidebar .social-links {
            margin-top: auto;
            padding-top: 1.5rem;
            display: flex;
            gap: 1.2rem;
            font-size: 1.2rem;
            color: #859bc9;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            justify-content: center;
        }

        .sidebar .social-links a {
            color: #9aafdb;
            transition: 0.2s;
        }

        .sidebar .social-links a:hover {
            color: white;
            transform: scale(1.1);
        }

        /* MOBILE MENU */

        .menu-toggle {
            display: none;
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 20;
            background: #1a1a2e;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* MAIN CONTENT */

        .main-content {
            margin-left: 240px;
            min-height: 100vh;
            padding: 55px 7%;
            background: #f5f0e7;
        }

        .page-container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        /* PAGE HEADER */

        .page-header {
            text-align: center;
            margin-bottom: 45px;
            padding: 35px 20px 25px;
            animation: fadeInUp 0.8s ease;
        }

        .page-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 800;
            color: #8b6745;
            letter-spacing: -2px;
            line-height: 1.15;
            margin-bottom: 18px;
            text-shadow: 2px 3px 0 rgba(139, 103, 69, 0.08);
        }

        .page-header h1 span {
            color: #b58b5c;
        }

        .page-header .heading-decoration {
            width: 75px;
            height: 4px;
            background: linear-gradient(to right, #b58b5c, #d9bd94);
            border-radius: 10px;
            margin: 0 auto 22px;
        }

        .page-header p {
            color: #766b5e;
            font-size: 1.05rem;
            max-width: 650px;
            margin: auto;
            line-height: 1.85;
        }

        /* VIDEO SECTION */

        .video-section {
            background: #fffdf8;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #e9dfcf;
            box-shadow: 0 10px 35px rgba(91, 69, 43, 0.07);
            margin-bottom: 25px;
            animation: fadeIn 0.8s ease;
        }

        .video-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #493a2b;
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .video-title i {
            color: #b58b5c;
        }

        .video-wrapper {
            width: 100%;
            background: #111827;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #111827;
        }

        .video-description {
            color: #766b5e;
            font-size: 0.95rem;
            margin-top: 18px;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            color: #9a8d7b;
            font-size: 0.85rem;
            padding: 40px 0 10px;
        }

        /* ANIMATIONS */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {
            .main-content {
                padding: 45px 5%;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 90px 25px 40px;
            }

            .video-section {
                padding: 22px;
            }

            .page-header {
                padding-top: 15px;
            }
        }

        @media (max-width: 420px) {
            .main-content {
                padding: 85px 18px 30px;
            }

            .video-section {
                padding: 18px;
            }

            .page-header h1 {
                font-size: 2.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- MOBILE MENU BUTTON -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
    </button>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <h2>Khuzairy</h2>
        <div class="title-tag">Information Technology Student</div>

        <nav class="sidebar-nav">
            <a href="index.html">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>

            <a href="about.html">
                <i class="fas fa-user"></i>
                <span>About</span>
            </a>

            <a href="biodata.html">
                <i class="fas fa-id-card"></i>
                <span>My Biodata</span>
            </a>

            <a href="portfolio.html">
                <i class="fas fa-folder-open"></i>
                <span>My Portfolio</span>
            </a>

            <a href="video.html" class="active">
                <i class="fas fa-video"></i>
                <span>My Video</span>
            </a>

            <a href="comments.html">
                <i class="fas fa-comment-dots"></i>
                <span>Your Comments</span>
            </a>
        </nav>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/mohdkhuzairy"
               target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>

            <a href="https://github.com/MohdKhuzairyy"
               target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="page-container">

            <header class="page-header">

                <h1>My <span>Video.</span></h1>

                <div class="heading-decoration"></div>

                <p>
                    Get to know me through this short personal introduction
                    video
                </p>

            </header>

            <!-- INTRODUCTION VIDEO -->
            <section class="video-section">

                <h2 class="video-title">
                    <i class="fas fa-play-circle"></i>
                    Personal Introduction
                </h2>

                <div class="video-wrapper">
                    <video controls preload="metadata">
                        <source src="assets/videos/intro.mp4" type="video/mp4">
                        Your browser does not support the video element.
                    </video>
                </div>


            </section>

            <!-- FOOTER -->
            <footer class="footer">
                <p>
                    &copy; <span id="year"></span>
                    Mohammad Khuzairy. All Rights Reserved.
                </p>
            </footer>

        </div>

    </main>

    <script>
        const menuToggle = document.getElementById("menuToggle");
        const sidebar = document.getElementById("sidebar");

        menuToggle.addEventListener("click", function () {
            sidebar.classList.toggle("open");

            const icon = menuToggle.querySelector("i");

            if (sidebar.classList.contains("open")) {
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-times");
            } else {
                icon.classList.remove("fa-times");
                icon.classList.add("fa-bars");
            }
        });

        document.querySelectorAll(".sidebar-nav a").forEach(link => {
            link.addEventListener("click", function () {
                sidebar.classList.remove("open");

                const icon = menuToggle.querySelector("i");
                icon.classList.remove("fa-times");
                icon.classList.add("fa-bars");
            });
        });

        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
